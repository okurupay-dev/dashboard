<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta
      name="description"
      content="OkuruDash - Secure Business Dashboard"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Okuru Dashboard</title>
    
    <!-- Suppress browser extension errors -->
    <script>
      // Prevent browser extension errors from breaking the app
      window.addEventListener('error', function(e) {
        // Block all chrome extension errors
        if (e.filename && e.filename.includes('chrome-extension://')) {
          e.preventDefault();
          console.warn('Browser extension error suppressed:', e.message);
          return false;
        }
        
        // Block specific wallet extension errors
        if (e.message && (
          e.message.includes('REQUEST_ID') ||
          e.message.includes('cardano') ||
          e.message.includes('wallet') ||
          e.message.includes('extension')
        )) {
          e.preventDefault();
          console.warn('Wallet extension error suppressed:', e.message);
          return false;
        }
      });

      // Also suppress unhandled promise rejections from extensions
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.toString().includes('chrome-extension://')) {
          e.preventDefault();
          console.warn('Extension promise rejection suppressed');
          return false;
        }
      });

      // Prevent extensions from accessing sensitive globals
      const blockExtensionGlobals = ['cardano', 'eternl', 'lace', 'nami', 'flint', 'typhon'];
      blockExtensionGlobals.forEach(globalName => {
        try {
          Object.defineProperty(window, globalName, {
            get: function() { return undefined; },
            set: function() { return false; },
            configurable: false
          });
        } catch (e) {
          // Some extensions might have already defined these, ignore errors
          console.warn(`Could not block ${globalName} global:`, e.message);
        }
      });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
